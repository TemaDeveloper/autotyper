[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotyper"
version = "0.1.0"
description = "AI coding assistant that reads a task, plans a solution with Claude, and types it into Android Studio - pausing whenever you leave the IDE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8",
  "rich>=13",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/TemaDeveloper/autotyper"
Issues = "https://github.com/TemaDeveloper/autotyper/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autotyper = "autotyper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autotyper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
